<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Will You Be My Valentine</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: pink;
      }

      h1 {
        margin-bottom: 30px;
      }

      button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        position: absolute;
      }

      #yes {
        position: static;
        margin-right: 20px;
      }

      #no {
        background-color: #ff6b6b;
      }

      .buttons {
        position: relative;
        width: 300px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <h1>Gusto mo ako maging Valentine date no Mary Ann?🤔 </h1>

    <div class="buttons">
      <button id="yes">YES 😍</button>
      <button id="no">NO 🙈</button>
    </div>

    <script>
      const noButton = document.getElementById("no");
      const yesButton = document.getElementById("yes");

      noButton.addEventListener("mouseover", () => {
        const x = Math.random() * 200;
        const y = Math.random() * 150;
        noButton.style.left = x + "px";
        noButton.style.top = y + "px";
      });

      yesButton.addEventListener("click", () => {
        document.body.innerHTML = "<h1>Yay! sabi na ehh! hahah 💘🥰</h1>";
      });
    </script>
  </body>
</html>
