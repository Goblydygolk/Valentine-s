<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Will You Be My Valentine</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: pink;
        margin: 0;
        overflow: hidden;
      }

      h1 {
        margin-bottom: 30px;
        z-index: 2;
      }

      button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        position: absolute;
        z-index: 2;
      }

      #yes {
        position: static;
        margin-right: 20px;
      }

      #no {
        background-color: #ff6b6b;
      }

      .buttons {
        position: relative;
        width: 300px;
        height: 200px;
        z-index: 2;
      }

      /* FULL SCREEN IMAGE */
      .fullscreen-img {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      .overlay-text {
        position: fixed;
        top: 30px;
        color: white;
        font-size: 2.5rem;
        font-weight: bold;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <h1>Will you be my Valentine 💖</h1>

    <div class="buttons">
      <button id="yes">YES 😍</button>
      <button id="no">NO 🙈</button>
    </div>

    <script>
      const noButton = document.getElementById("no");
      const yesButton = document.getElementById("yes");

      noButton.addEventListener("mouseover", () => {
        const x = Math.random() * 200;
        const y = Math.random() * 150;
        noButton.style.left = x + "px";
        noButton.style.top = y + "px";
      });

      yesButton.addEventListener("click", () => {
        document.body.innerHTML = `
          <img src="123.webp" class="fullscreen-img" alt="Full screen image">
          <div class="overlay-text">I knew you’d say YES 💘🥰</div>
        `;
      });
    </script>
  </body>
</html>
